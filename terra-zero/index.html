});

function renderDiary(){
  const today=`<div class="entry today"><h4>Oggi · giorno ${day()}<small>${SEASONS[season()]} · ${WEATHER[S.weather].n}</small></h4><ul>${S.today.slice().reverse().map(e=>`<li class="ev-${e.k}"><time>${e.h}</time><span>${esc(e.x)}</span></li>`).join("")||`<li><time></time><span class="hint">La giornata è appena cominciata.</span></li>`}</ul></div>`;
  const past=S.diary.slice(0,120).map(en=>`<div class="entry"><h4>Giorno ${en.d}<small>${SEASONS[en.s]} · ${WEATHER[en.w].n}</small></h4>
    <ul>${en.ev.map(e=>`<li class="ev-${e.k}"><time>${e.h}</time><span>${esc(e.x)}</span></li>`).join("")||`<li><time></time><span class="hint">Una giornata tranquilla.</span></li>`}</ul>
    ${en.sum?`<p class="sum">${esc(en.sum)}</p>`:""}${en.notes.length?`<div class="notes">${en.notes.map(n=>`<span>${esc(n)}</span>`).join("")}</div>`:""}</div>`).join("");
  $("tab-diary").innerHTML=`<p class="hint">Ogni sera i pensieri di tutti finiscono qui. Le giornate più recenti sono in alto.</p>`+today+past;
}
function renderDisc(){
  const ppl=alive().filter(p=>!isChild(p));
  const items=DISC.map(d=>{
    const rec=S.disc[d.id];
    if (rec){ const who=alive().filter(p=>has(p,d.id)).map(p=>p.name); return `<div class="disc done"><b>${d.n}</b><span class="st">Scoperta</span><p>${d.d}</p><p>Prima volta: ${esc(rec.by)}, giorno ${rec.day}.${who.length?" La sanno fare: "+esc(who.join(", "))+".":""}</p></div>`; }
    const ready=ppl.some(p=>reqsMet(p,d));
    if (d.special) return `<div class="disc ${S.words.length?"open":"lock"}"><b>${d.n}</b><span class="st">${S.words.length}/12 parole</span><p>${d.d} Nasce stando insieme: ogni chiacchierata può inventare una parola.</p></div>`;
    if (!ready){ const miss=d.req.filter(r=>!S.disc[r]).map(r=>DISCBY[r].n); return `<div class="disc lock"><b>${d.n}</b><span class="st">Bloccata</span><p>${miss.length?"Serve prima: "+miss.join(", ")+".":"Qualcuno deve prima imparare ciò che serve."}</p></div>`; }
    const insp=inspired(d.id);
    return `<div class="disc open"><b>${d.n}</b><span class="st">Possibile</span><p>${hintFor(d)}</p></div>`;
  }).join("");
  const words=S.words.length?`<div class="words">${S.words.map(w=>`<span class="chip"><b>${esc(w.w)}</b> = ${esc(w.c)}</span>`).join("")}</div>`:`<p class="hint">Nessuna parola ancora: per ora si capiscono a gesti.</p>`;
  $("tab-disc").innerHTML=`<p class="hint">Le scoperte nascono dall'esperienza: più toccano pietre, rami e animali, più è probabile un'intuizione. Qui vedi cosa hanno già capito e cosa potrebbero capire presto.</p><div class="dl">${items}</div><h3>Il loro vocabolario</h3>${words}`;
}
function hintFor(d){
  const h={selce:"Nasce raccogliendo e battendo pietre.",bastone:"Nasce maneggiando rami.",fibre:"Nasce raccogliendo erba, bacche e canne.",fuoco:"Nasce battendo la selce, o guardando un incendio da vicino.",lancia:"Combinando selce e bastone, sperimentando.",cesto:"Intrecciando fibre mentre raccolgono.",capanna:"Sperimentando con rami e fibre.",cottura:"Mangiando vicino a un fuoco acceso.",pesca:"Provando a pescare con la lancia.",vestiti:"Sperimentando con una pelle di animale.",vasi:"Dopo aver giocato con l'argilla vicino all'acqua.",agricoltura:"Raccogliendo e mangiando tanti frutti e semi.",arco:"Cacciando spesso con la lancia.",medicina:"Raccogliendo a lungo erbe e funghi.",addomesticamento:"Cacciando e vivendo vicino agli animali.",musica:"Stando insieme attorno al fuoco.",pittura:"Stando insieme e sperimentando col carbone.",casa:"Sperimentando con capanna e argilla cotta.",pane:"Mangiando farro vicino al fuoco."}[d.id];
  return h||d.d;
}
void (e=>{ const b=e.target.closest("[data-insp]"); if (!b||b.disabled) return; const d=DISCBY[b.dataset.insp]; S.inspire={id:d.id,until:day()+2}; log(`Hai sussurrato un'idea nei loro sogni: ${d.n.toLowerCase()}.`,"imp"); dirty.disc=true; });

const POWERS=[
  {k:"pioggia", n:"Pioggia", d:"Fai piovere oggi: meno sete, ma più freddo.", cd:2, run(){ S.weather="pioggia"; S.lightAt=-1; log("Hai chiamato la pioggia sul mondo.","imp"); return true; }},
  {k:"sole", n:"Bel tempo", d:"Spazza via nuvole e neve.", cd:2, run(){ S.weather="sereno"; S.lightAt=-1; log("Hai aperto il cielo: torna il sole.","imp"); return true; }},
  {k:"fulmine", n:"Fulmine", d:"Colpisci un albero vicino a loro: un incendio può insegnare il fuoco.", cd:3, run(){ return lightning(true) || (toast("Non c'è nessun albero adatto vicino a loro.","bad"),false); }},
  {k:"abbondanza", n:"Abbondanza", d:"Ogni cespuglio e albero da frutto visto si carica di cibo.", cd:6, run(){ for (const t of S.tiles){ if (!t.seen) continue; if (t.bush) t.berries=5; if (t.tree===2||t.tree===3) t.fruit=5; } log("Hai fatto maturare in una notte tutti i frutti del mondo conosciuto.","imp"); return true; }},
  {k:"branco", n:"Branco", d:"Fai arrivare cervi e conigli vicino a loro.", cd:4, run(){ const c=alive()[0]; if (!c) return false; let n=0; for (let k=0;k<6;k++){ const r=bfs(tx(c),ty(c),(t,x,y,d)=>d>=4 && (t.t===T.GRASS||t.t===T.FOREST) && Math.random()<.1,12); if (r){ spawnAnimal(k%2?"coniglio":"cervo",r.x,r.y); n++; } } log("Un branco di animali è arrivato nella valle.","imp"); return n>0; }},
  {k:"viandanti", n:"Viandanti", d:"Due sconosciuti arrivano da lontano. Nuove amicizie, nuove famiglie.", cd:15, run(){ return wanderers(); }}
];
function wanderers(){
  if (alive().length>MAX_POP-2){ toast("Il mondo è già affollato.","bad"); return false; }
  const c=alive()[0]; if (!c) return false;
  const r=bfs(tx(c),ty(c),(t,x,y,d)=>d>=12 && t.t!==T.SHALLOW && Math.random()<.08,30,true); if (!r) return false;
  const nm=NAMES_M.filter(n=>!S.nameUsed.includes(n)), nf=NAMES_F.filter(n=>!S.nameUsed.includes(n));
  const m=pick(nm)||"Straniero", f=pick(nf)||"Straniera"; S.nameUsed.push(m,f);
  const basic=["selce","bastone","fibre"].filter(()=>Math.random()<.5);
  newPerson(m,"M",r.x,r.y,{age:(17+Math.floor(Math.random()*8))*YEAR_DAYS,known:basic});
  let bx=r.x, by=r.y; for (const [dx,dy] of DIRS){ if (inb(r.x+dx,r.y+dy) && passableT(tileAt(r.x+dx,r.y+dy))){ bx=r.x+dx; by=r.y+dy; break; } }
  newPerson(f,"F",bx,by,{age:(17+Math.floor(Math.random()*8))*YEAR_DAYS,known:basic});
  for (const p of S.people.slice(-2)) for (const q of S.people.slice(-2)) if (p!==q) p.rel[q.id]=25;
  log(`Due viandanti, ${m} e ${f}, sono comparsi all'orizzonte. Vengono da molto lontano.`,"imp"); dirty.people=true; return true;
}
function renderPowers(){
  const d=day();
  $("tab-powers").innerHTML=`<p class="hint">Sei la forza della natura di questo mondo. Ogni potere ha bisogno di qualche giorno per ricaricarsi.</p>
  <div class="powers">${POWERS.map(p=>{ const last=S.powers[p.k]; const ready=last==null||d-last>=p.cd; return `<div class="power"><b>${p.n}</b><button class="btn" data-pow="${p.k}" ${ready?"":"disabled"}>${ready?"Usa":"Dal giorno "+(last+p.cd)}</button><p>${p.d}</p></div>`; }).join("")}</div>
  <h3>Opzioni</h3>
  <label class="tog"><input type="checkbox" id="optReveal" ${S.opts.reveal?"checked":""}> Mostra tutto il mondo, anche le zone inesplorate</label>
  <h3>Nuovo mondo</h3>
  <p class="hint">Genera una nuova terra con altri due abitanti. La partita attuale verrà persa.</p>
  <div class="row2"><label class="field">Lui<input id="nmM" value="Adamo" maxlength="14"></label><label class="field">Lei<input id="nmF" value="Eva" maxlength="14"></label></div>
  <button class="btn" id="newWorld">Crea un nuovo mondo</button>
  <p class="hint">Mondo n° ${S.seed} · la partita si salva da sola ogni alba in questo browser.</p>`;
}
$("newWorld").onclick=e=>{
  const b=e.currentTarget;
  if (!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Sicuro? Tocca di nuovo"; b.classList.add("primary"); setTimeout(()=>{ delete b.dataset.sure; b.textContent="Nuovo mondo"; b.classList.remove("primary"); },4000); return; }
  delete b.dataset.sure; b.textContent="Nuovo mondo"; b.classList.remove("primary");
  $("over").hidden=true; hideBanner(); newGame("Adamo","Eva"); saveGame(); setTab("people");
};
function updateHeader(){
  $("hDay").textContent=`Giorno ${day()}`;
  $("hSeason").textContent=`${SEASONS[season()]} · anno ${Math.floor((day()-1)/YEAR_DAYS)+1}`;
  $("hMeta").textContent=`${WEATHER[S.weather].n} · ${timeStr()} · ${Math.round(tempNow())}°C`;
  $("sPop").textContent=alive().length;
  $("sDisc").textContent=`${Object.keys(S.disc).length}/${DISC.length}`;
  $("sWords").textContent=S.words.length;
  $("sSeen").textContent=Math.round(S.seenCount/(W*H)*100)+"%";
  $("dayMark").style.left=`calc(${tod()/DAY*100}% - 1px)`;
  $("play").textContent=paused?"Riprendi":"Pausa";
  for (const b of $("speeds").children) b.setAttribute("aria-pressed",String(+b.dataset.sp===speed));
}
let lastSig="";
function updateUI(){
  updateHeader();
  const sig=alive().map(p=>p.id+":"+(p.order?p.order.k:"")).join(",")+"|"+selected;
  if (sig!==lastSig){ lastSig=sig; dirty.people=true; }
  if (tab==="people"){ if (dirty.people){ renderPeople(); dirty.people=false; } if (dirty.detail){ renderDetail(); dirty.detail=false; } updatePeople(); updateDetail(); }
  if (tab==="diary" && dirty.diary){ renderDiary(); dirty.diary=false; }
  if (tab==="disc" && dirty.disc){ renderDisc(); dirty.disc=false; }
}

$("play").onclick=()=>{ paused=!paused; if (!paused) hideBanner(); };
$("speeds").onclick=e=>{ const b=e.target.closest("[data-sp]"); if (b) speed=+b.dataset.sp; };
$("director").onchange=e=>{ director=e.target.checked; holdUntil=0; lastFocus=0; };
document.addEventListener("keydown",e=>{ if (e.target.closest("input")) return; if (e.code==="Space"){ e.preventDefault(); paused=!paused; if (!paused) hideBanner(); } });
document.addEventListener("visibilitychange",()=>{ if (document.hidden) saveGame(); });

let lastT=0, acc=0;
function frame(t){
  const dt=Math.min(.25,(t-lastT)/1000||0); lastT=t;
  if (!paused && !S.over){ acc+=dt*8*speed; let n=0; while (acc>=1 && n<400){ tick(); acc-=1; n++; if (paused) { acc=0; break; } } }
  else acc=0;
  directorTick(t);
  draw(t);
  requestAnimationFrame(frame);
}

function start(data){
  let ok=false;
  if (data && data.save) ok=loadGame(data.save);
  if (!ok){ try{ const s=localStorage.getItem(SAVE_KEY); if (s) ok=loadGame(s); }catch(e){} }
  if (!ok) newGame("Adamo","Eva");
  else { selected=alive()[0]?.id||null; cam.follow=selected; const p=personById(selected); if (p){ cam.x=p.x+.5; cam.y=p.y+.5; } fitZoom(); if (data && data.save){ paused=!!data.paused; speed=data.speed||1; } }
  resize(); setTab(tab);
  if (S.over) showOver();
  setInterval(updateUI,250); updateUI();
  requestAnimationFrame(frame);
}
window.addEventListener("resize",()=>resize());
window.claude?.hot?.snapshot?.(()=>({ save:JSON.stringify(S), paused, speed }));
window.__terraZero = { get S(){ return S; }, tick, newGame, days(n){ for (let i=0;i<n*DAY && !S.over;i++) tick(); } };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
<!-- wrapper -->
</body>
